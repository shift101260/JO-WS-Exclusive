<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>睿立集團 - 專屬客戶服務與報價系統</title>
    <style>
        :root {
            --ruili-bg: #FBF9F5;       /* 主背景色：溫潤米白 / 燕麥奶色 */
            --ruili-brand: #D4A373;    /* 主品牌色：暖焦糖棕 / 大地奶茶色 */
            --ruili-sidebar: #2C2A29;  /* 側邊欄底色：暖木炭灰 / 深褐炭色 */
            --ruili-sidebar-hover: #3E3B3A; /* 側邊欄懸停色 */
            --ruili-matcha: #E9EDC9;   /* 輔助標籤色：柔和抹茶綠 */
            --ruili-pink: #EED7C5;     /* 輔助強調色：柔杏粉棕 */
            --ruili-dark: #292524;     /* 深色文字 */
            --ruili-border: #E7E5E4;   /* 淺色邊框 */
            --card-border: rgba(212, 163, 115, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 1. 基礎畫面配置 */
        body {
            background-color: var(--ruili-bg);
            color: var(--ruili-dark);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 2. 左側固定側邊欄 (桌機端預設顯示) */
        .ruili-sidebar {
            width: 16rem; /* 256px */
            background-color: var(--ruili-sidebar);
            color: #d1d5db;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 1px solid var(--ruili-dark);
            flex-shrink: 0;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
        }

        .sidebar-top {
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding: 24px 16px;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 16px;
        }

        .sidebar-logo-box {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .sidebar-logo-box img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
        }

        .sidebar-brand-text h2 {
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #ffffff;
            margin: 0;
        }

        .sidebar-brand-text p {
            font-size: 0.7rem;
            color: var(--ruili-brand);
            letter-spacing: 0.5px;
            margin: 2px 0 0 0;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 10px;
            color: #d1d5db;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .menu-item:hover, .menu-item.active {
            background-color: var(--ruili-sidebar-hover);
            color: #ffffff;
        }

        .menu-item.active {
            background-color: var(--ruili-brand);
            color: var(--ruili-sidebar);
            font-weight: 600;
        }

        .sidebar-footer {
            font-size: 0.75rem;
            color: #9ca3af;
            text-align: center;
            padding: 20px 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* 手機版專用頂部導覽列（預設桌機隱藏） */
        .mobile-header-bar {
            display: none;
        }

        /* 3. 右側主畫面內容區域 */
        .ruili-main {
            margin-left: 16rem; /* 預留桌機側邊欄寬度 */
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: var(--ruili-bg);
            overflow-y: auto;
        }

        .ruili-container {
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* 頂部標題與雙 LOGO 橫幅 */
        .content-header {
            background: #ffffff;
            border: 1px solid var(--ruili-border);
            border-radius: 20px;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(41, 37, 36, 0.03);
            margin-bottom: 30px;
        }

        .header-titles h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--ruili-sidebar);
            margin: 0 0 6px 0;
            line-height: 1.4;
        }

        .header-titles .badge {
            display: inline-block;
            font-size: 0.75rem;
            background-color: var(--ruili-pink);
            color: var(--ruili-dark);
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .header-logos {
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }

        .header-logo-box {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            background: var(--ruili-bg);
            border: 1px solid var(--ruili-border);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .header-logo-box img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
        }

        /* 功能卡片區 */
        .section-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--ruili-sidebar);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        /* 桌機端：網格卡片 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .action-card {
            background: #ffffff;
            border: 1px solid var(--ruili-border);
            border-radius: 16px;
            padding: 24px;
            text-decoration: none;
            color: var(--ruili-dark);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 150px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(41, 37, 36, 0.02);
        }

        .action-card:hover {
            border-color: var(--ruili-brand);
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(212, 163, 115, 0.15);
            background: linear-gradient(135deg, #ffffff 0%, #FAF8F5 100%);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--ruili-bg);
            border: 1px solid var(--ruili-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .card-action-icon {
            font-size: 0.9rem;
            color: var(--ruili-brand);
            transition: transform 0.2s ease;
        }

        .action-card:hover .card-action-icon {
            transform: translateX(4px);
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--ruili-sidebar);
            margin-top: 15px;
        }

        /* 4. 手機直式響應式優化 (RWD - 螢幕小於 768px 時觸發) */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            /* 隱藏桌機側邊欄，改顯示頂部導覽列 */
            .ruili-sidebar {
                display: none; 
            }
            .mobile-header-bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 14px 20px;
                background-color: var(--ruili-sidebar);
                color: white;
                border-bottom: 1px solid var(--ruili-dark);
                position: sticky;
                top: 0;
                z-index: 50;
            }
            .mobile-brand {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .mobile-brand img {
                width: 32px;
                height: 32px;
                border-radius: 6px;
                background: #fff;
                object-fit: contain;
            }
            .mobile-brand span {
                font-size: 0.9rem;
                font-weight: 600;
                letter-spacing: 0.5px;
            }
            .ruili-main {
                margin-left: 0 !important;
                width: 100%;
            }
            .ruili-container {
                padding: 16px;
            }
            .content-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
                padding: 20px;
                border-radius: 16px;
            }
            .header-titles h1 {
                font-size: 1.1rem;
            }
            .header-logos {
                width: 100%;
                justify-content: flex-start;
            }
            
            /* 手機版卡片改為類似截圖的滿版長條按鈕清單 */
            .cards-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .action-card {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                min-height: auto;
                padding: 18px 20px;
                border-radius: 16px;
            }
            .card-top {
                display: contents; /* 讓內部元素重新排列為左右結構 */
            }
            .card-icon {
                width: 40px;
                height: 40px;
                border-radius: 10px;
                margin-right: 12px;
            }
            .card-title {
                margin-top: 0;
                flex: 1;
                font-size: 1rem;
            }
            .card-action-icon {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- 手機專用頂部導覽列 -->
    <header class="mobile-header-bar">
        <div class="mobile-brand">
            <img src="./ruili-logo.png" alt="Logo">
            <span>睿立集團 ERP</span>
        </div>
        <span style="font-size: 0.8rem; color: var(--ruili-brand);">Client Portal</span>
    </header>

    <!-- 左側固定側邊欄 (桌機端顯示) -->
    <aside class="ruili-sidebar">
        <div class="sidebar-top">
            <div class="sidebar-brand">
                <div class="sidebar-logo-box">
                    <img src="./ruili-logo.png" alt="Ruili Logo">
                </div>
                <div class="sidebar-brand-text">
                    <h2>睿立集團</h2>
                    <p>RUILI GROUP ERP</p>
                </div>
            </div>

            <nav class="sidebar-menu">
                <a href="#workflow" class="menu-item" onclick="openModule('workflow')">
                    <span class="icon">📊</span>
                    <span>專案執行流程</span>
                </a>
                <a href="#quotation" class="menu-item" onclick="openModule('quotation')">
                    <span class="icon">💰</span>
                    <span>睿立報價單</span>
                </a>
                <a href="#documents" class="menu-item" onclick="openModule('documents')">
                    <span class="icon">📁</span>
                    <span>總結說明</span>
                </a>
                <a href="#contact" class="menu-item" onclick="openModule('contact')">
                    <span class="icon">💬</span>
                    <span>專屬顧問諮詢</span>
                </a>
            </nav>
        </div>

        <div class="sidebar-footer">
            <span>© 2026 Ruili</span>
        </div>
    </aside>

    <!-- 右側主內容區 -->
    <main class="ruili-main">
        <div class="ruili-container">
            <!-- 頂部資訊列 -->
            <header class="content-header">
                <div class="header-titles">
                    <h1>玖業光電科技有限公司</h1>
                    <h1>威欣系統股份有限公司</h1>
                    <div class="badge">專屬入口</div>
                </div>
                <div class="header-logos">
                    <div class="header-logo-box">
                        <img src="./logo1.png" alt="Logo 1">
                    </div>
                    <div class="header-logo-box">
                        <img src="./logo2.png" alt="Logo 2">
                    </div>
                </div>
            </header>

            <!-- 常用功能專區 -->
            <section>
                <div class="section-title">
                    <span>⚡</span> 專屬服務與報價模組
                </div>
                <div class="cards-grid">
                    <a href="#workflow" class="action-card" onclick="openModule('workflow')">
                        <div class="card-top">
                            <div class="card-icon">📊</div>
                            <div class="card-title">專案執行流程</div>
                        </div>
                        <span class="card-action-icon">➔</span>
                    </a>

                    <a href="#quotation" class="action-card" onclick="openModule('quotation')">
                        <div class="card-top">
                            <div class="card-icon">💰</div>
                            <div class="card-title">睿立報價單</div>
                        </div>
                        <span class="card-action-icon">➔</span>
                    </a>

                    <a href="#documents" class="action-card" onclick="openModule('documents')">
                        <div class="card-top">
                            <div class="card-icon">📁</div>
                            <div class="card-title">總結說明</div>
                        </div>
                        <span class="card-action-icon">➔</span>
                    </a>

                    <a href="#contact" class="action-card" onclick="openModule('contact')">
                        <div class="card-top">
                            <div class="card-icon">💬</div>
                            <div class="card-title">專屬顧問諮詢</div>
                        </div>
                        <span class="card-action-icon">➔</span>
                    </a>
                </div>
            </section>
        </div>
    </main>

    <script>
        function openModule(moduleName) {
            console.log("切換至模組: " + moduleName);
        }
    </script>

</body>
</html>
