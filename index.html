<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玖業光電 & 威欣系統 - 專屬客戶服務系統</title>
    <style>
        :root {
            /* 睿立集團專屬品牌色號卡 */
            --ruili-bg: #FBF9F5;       /* 主背景色：溫潤米白 / 燕麥奶色 */
            --ruili-brand: #D4A373;    /* 主品牌色：暖焦糖棕 / 大地奶茶色 */
            --ruili-sidebar: #2C2A29;  /* 側邊欄/深色底：暖木炭灰 / 深褐炭色 */
            --ruili-matcha: #E9EDC9;   /* 輔助標籤色：柔和抹茶綠 / 灰綠色 */
            --ruili-pink: #EED7C5;     /* 輔助強調色：柔杏粉棕 / 暖肉粉色 */
            --ruili-dark: #292524;     /* 深色文字/邊框：深石灰 / 暖墨色 */
            --ruili-border: #E7E5E4;   /* 淺色邊框：燕麥灰 / 暖卡其邊框 */
            
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(212, 163, 115, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--ruili-bg);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(212, 163, 115, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(233, 237, 201, 0.1) 0%, transparent 40%);
            color: var(--ruili-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 溫潤質感電子名片外框容器 */
        .card-container {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 24px;
            box-shadow: 0 20px 40px rgba(41, 37, 36, 0.06), 
                        0 0 40px rgba(212, 163, 115, 0.08);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* 頂部品牌色裝飾線 */
        .card-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--ruili-brand), var(--ruili-matcha), var(--ruili-brand));
        }

        /* 雙 LOGO 顯示區 */
        .logo-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .logo-box {
            width: 75px;
            height: 75px;
            border-radius: 18px;
            background: #ffffff;
            border: 1px solid var(--ruili-border);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(41, 37, 36, 0.04);
            transition: all 0.3s ease;
        }

        .logo-box:hover {
            border-color: var(--ruili-brand);
            transform: translateY(-2px);
        }

        .logo-box img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
        }

        /* 公司名稱與標題區 */
        .profile-info {
            margin-bottom: 32px;
        }

        .profile-info h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--ruili-sidebar);
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .profile-info .sub-title {
            display: inline-block;
            font-size: 0.8rem;
            color: var(--ruili-dark);
            background-color: var(--ruili-pink);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        /* 按鈕群組 */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border: 1px solid var(--ruili-border);
            border-radius: 14px;
            padding: 16px 20px;
            color: var(--ruili-sidebar);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 6px rgba(41, 37, 36, 0.02);
        }

        .menu-btn:hover {
            background: var(--ruili-sidebar);
            color: #ffffff;
            border-color: var(--ruili-sidebar);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(44, 42, 41, 0.15);
        }

        .menu-btn:hover .arrow {
            color: var(--ruili-brand);
            transform: translateX(4px);
        }

        .menu-btn:hover .icon-badge {
            background: rgba(212, 163, 115, 0.2);
        }

        .menu-btn .btn-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon-badge {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--ruili-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: background 0.3s ease;
            border: 1px solid var(--ruili-border);
        }

        .menu-btn .arrow {
            color: var(--ruili-brand);
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        /* 底部版權宣告與微型 LOGO 格 */
        .footer-note {
            margin-top: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--ruili-dark);
            opacity: 0.75;
            letter-spacing: 0.5px;
        }

        .footer-logo {
            width: 20px;
            height: 20px;
            border-radius: 5px;
            background: #ffffff;
            border: 1px solid var(--ruili-border);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 2px 4px rgba(41, 37, 36, 0.05);
        }

        .footer-logo img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- 雙 LOGO 顯示區 -->
        <div class="logo-section">
            <div class="logo-box">
                <img src="./logo1.png" alt="玖業光電 Logo">
            </div>
            <div class="logo-box">
                <img src="./logo2.png" alt="威欣系統 Logo">
            </div>
        </div>

        <!-- 標題與簡介 -->
        <div class="profile-info">
            <h1>玖業光電科技有限公司</h1>
            <h1>威欣系統股份有限公司</h1>
            <div class="sub-title">專屬客戶服務與報價入口</div>
        </div>

        <!-- 四個功能按鈕 -->
        <div class="menu-grid">
            <a href="#workflow" class="menu-btn" onclick="openModule('workflow')">
                <div class="btn-content">
                    <div class="icon-badge">📊</div>
                    <span>專案執行流程</span>
                </div>
                <span class="arrow">➔</span>
            </a>

            <a href="#quotation" class="menu-btn" onclick="openModule('quotation')">
                <div class="btn-content">
                    <div class="icon-badge">💰</div>
                    <span>睿立報價單</span>
                </div>
                <span class="arrow">➔</span>
            </a>

            <a href="#documents" class="menu-btn" onclick="openModule('documents')">
                <div class="btn-content">
                    <div class="icon-badge">📁</div>
                    <span>總結說明</span>
                </div>
                <span class="arrow">➔</span>
            </a>

            <a href="#contact" class="menu-btn" onclick="openModule('contact')">
                <div class="btn-content">
                    <div class="icon-badge">💬</div>
                    <span>專屬顧問諮詢</span>
                </div>
                <span class="arrow">➔</span>
            </a>
        </div>

        <!-- 底部帶有微型 LOGO 的版權宣告 -->
        <div class="footer-note">
            <div class="footer-logo">
                <img src="./ruili-logo.png" alt="Ruili Logo">
            </div>
            <span>RUILI GROUP © 2026</span>
        </div>
    </div>

    <script>
        function openModule(moduleName) {
            console.log("切換至模組: " + moduleName);
        }
    </script>

</body>
</html>
