<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>睿立集團 - 專屬客戶服務與報價系統</title>
    <style>
        :root {
            --ruili-bg: #FBF9F5;       /* 主背景色：溫潤米白 / 燕麥奶色 */
            --ruili-brand: #D4A373;    /* 主品牌色：暖焦糖棕 / 大地奶茶色 */
            --ruili-sidebar: #2C2A29;  /* 側邊欄底色：暖木炭灰 / 深褐炭色 */
            --ruili-sidebar-hover: #3E3B3A; /* 側邊欄懸停色 */
            --ruili-matcha: #E9EDC9;   /* 輔助標籤色：柔和抹茶綠 */
            --ruili-pink: #EED7C5;     /* 輔助強調色：柔杏粉棕 */
            --ruili-dark: #292524;     /* 深色文字 */
            --ruili-border: #E7E5E4;   /* 淺色邊框 */
            --card-border: rgba(212, 163, 115, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--ruili-bg);
            color: var(--ruili-dark);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        /* ---------------- 左側固定側邊欄 ---------------- */
        .sidebar {
            width: 260px;
            background-color: var(--ruili-sidebar);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 16px;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }

        .sidebar-top {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 20px;
        }

        .sidebar-logo-box {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .sidebar-logo-box img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
        }

        .sidebar-brand-text h2 {
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .sidebar-brand-text p {
            font-size: 0.7rem;
            color: var(--ruili-brand);
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 10px;
            color: #d1d5db;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .menu-item:hover, .menu-item.active {
            background-color: var(--ruili-sidebar-hover);
            color: #ffffff;
        }

        .menu-item.active {
            background-color: var(--ruili-brand);
            color: var(--ruili-sidebar);
            font-weight: 600;
        }

        .menu-item .icon {
            font-size: 1.1rem;
        }

        .sidebar-footer {
            font-size: 0.75rem;
            color: #9ca3af;
            text-align: center;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* ---------------- 右側主內容區 ---------------- */
        .main-content {
            margin-left: 260px; /* 預留左側側邊欄空間 */
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* 頂部標題與雙 LOGO 橫幅 */
        .content-header {
            background: #ffffff;
            border: 1px solid var(--ruili-border);
            border-radius: 20px;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(41, 37, 36, 0.03);
        }

        .header-titles h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--ruili-sidebar);
            margin-bottom: 6px;
        }

        .header-titles .badge {
            display: inline-block;
            font-size: 0.75rem;
            background-color: var(--ruili-pink);
            color: var(--ruili-dark);
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        .header-logos {
            display: flex;
            gap: 12px;
        }

        .header-logo-box {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            background: var(--ruili-bg);
            border: 1px solid var(--ruili-border);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .header-logo-box img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
        }

        /* 功能卡片網格區 */
        .section-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--ruili-sidebar);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .action-card {
            background: #ffffff;
            border: 1px solid var(--ruili-border);
            border-radius: 16px;
            padding: 24px;
            text-decoration: none;
            color: var(--ruili-dark);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 160px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(41, 37, 36, 0.02);
            position: relative;
            overflow: hidden;
        }

        .action-card:hover {
            border-color: var(--ruili-brand);
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(212, 163, 115, 0.15);
            background: linear-gradient(135deg, #ffffff 0%, #FAF8F5 100%);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--ruili-bg);
            border: 1px solid var(--ruili-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .card-action-icon {
            font-size: 0.9rem;
            color: var(--ruili-brand);
            transition: transform 0.2s ease;
        }

        .action-card:hover .card-action-icon {
            transform: translateX(4px);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--ruili-sidebar);
            margin-top: 15px;
        }

        /* ---------------- RWD 響應式調整 ---------------- */
        @media (max-width: 900px) {
            .sidebar {
                width: 70px;
                padding: 16px 10px;
            }
            .sidebar-brand-text, .sidebar-footer span, .menu-item span {
                display: none; /* 手機版側邊欄只留圖示 */
            }
            .sidebar-brand {
                justify-content: center;
            }
            .menu-item {
                justify-content: center;
                padding: 12px;
            }
            .main-content {
                margin-left: 70px;
                padding: 20px;
            }
            .content-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- 左側固定側邊欄 -->
    <aside class="sidebar">
        <div class="sidebar-top">
            <div class="sidebar-brand">
                <div class="sidebar-logo-box">
                    <img src="./ruili-logo.png" alt="Ruili Logo">
                </div>
                <div class="sidebar-brand-text">
                    <h2>睿立集團</h2>
                    <p>RUILI GROUP ERP</p>
                </div>
            </div>

            <nav class="sidebar-menu">
                <a href="#" class="menu-item active">
                    <span class="icon">🏠</span>
                    <span>首頁總覽</span>
                </a>
                <a href="#workflow" class="menu-item" onclick="openModule('workflow')">
                    <span class="icon">📊</span>
                    <span>專案執行流程</span>
                </a>
                <a href="#quotation" class="menu-item" onclick="openModule('quotation')">
                    <span class="icon">💰</span>
                    <span>睿立報價單</span>
                </a>
                <a href="#documents" class="menu-item" onclick="openModule('documents')">
                    <span class="icon">📁</span>
                    <span>總結說明</span>
                </a>
                <a href="#contact" class="menu-item" onclick="openModule('contact')">
                    <span class="icon">💬</span>
                    <span>專屬顧問諮詢</span>
                </a>
            </nav>
        </div>

        <div class="sidebar-footer">
            <span>© 2026 Ruili</span>
        </div>
    </aside>

    <!-- 右側主內容區 -->
    <main class="main-content">
        <!-- 頂部資訊列 -->
        <header class="content-header">
            <div class="header-titles">
                <h1>玖業光電科技有限公司 & 威欣系統股份有限公司</h1>
                <div class="badge">專屬客戶服務與報價入口系統</div>
            </div>
            <div class="header-logos">
                <div class="header-logo-box">
                    <img src="./logo1.png" alt="Logo 1">
                </div>
                <div class="header-logo-box">
                    <img src="./logo2.png" alt="Logo 2">
                </div>
            </div>
        </header>

        <!-- 常用功能專區 -->
        <section>
            <div class="section-title">
                <span>⚡</span> 專屬服務與報價模組
            </div>
            <div class="cards-grid">
                <a href="#workflow" class="action-card" onclick="openModule('workflow')">
                    <div class="card-top">
                        <div class="card-icon">📊</div>
                        <span class="card-action-icon">➔</span>
                    </div>
                    <div class="card-title">專案執行流程</div>
                </a>

                <a href="#quotation" class="action-card" onclick="openModule('quotation')">
                    <div class="card-top">
                        <div class="card-icon">💰</div>
                        <span class="card-action-icon">➔</span>
                    </div>
                    <div class="card-title">睿立報價單</div>
                </a>

                <a href="#documents" class="action-card" onclick="openModule('documents')">
                    <div class="card-top">
                        <div class="card-icon">📁</div>
                        <span class="card-action-icon">➔</span>
                    </div>
                    <div class="card-title">總結說明</div>
                </a>

                <a href="#contact" class="action-card" onclick="openModule('contact')">
                    <div class="card-top">
                        <div class="card-icon">💬</div>
                        <span class="card-action-icon">➔</span>
                    </div>
                    <div class="card-title">專屬顧問諮詢</div>
                </a>
            </div>
        </section>
    </main>

    <script>
        function openModule(moduleName) {
            console.log("切換至模組: " + moduleName);
        }
    </script>

</body>
</html>
