<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玖業光電 & 威欣系統 - 專屬客戶服務與報價系統</title>
    <style>
        :root {
            --ruili-bg: #FBF9F5;       /* 主背景色：溫潤米白 / 燕麥奶色 */
            --ruili-brand: #D4A373;    /* 主品牌色：暖焦糖棕 / 大地奶茶色 */
            --ruili-sidebar: #2C2A29;  /* 側邊欄/深色底：暖木炭灰 / 深褐炭色 */
            --ruili-matcha: #E9EDC9;   /* 輔助標籤色：柔和抹茶綠 / 灰綠色 */
            --ruili-pink: #EED7C5;     /* 輔助強調色：柔杏粉棕 / 暖肉粉色 */
            --ruili-dark: #292524;     /* 深色文字/邊框：深石灰 / 暖墨色 */
            --ruili-border: #E7E5E4;   /* 淺色邊框：燕麥灰 / 暖卡其邊框 */
            
            --panel-bg: rgba(255, 255, 255, 0.9);
            --panel-border: rgba(212, 163, 115, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--ruili-bg);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(212, 163, 115, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(233, 237, 201, 0.12) 0%, transparent 45%);
            color: var(--ruili-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }

        /* 頂部導覽列裝飾線 */
        .top-accent-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--ruili-brand), var(--ruili-matcha), var(--ruili-brand));
            z-index: 1000;
        }

        /* 電腦橫版滿版外框容器 */
        .main-container {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--panel-border);
            border-radius: 28px;
            padding: 60px;
            box-shadow: 0 30px 60px rgba(41, 37, 36, 0.06), 
                        0 0 60px rgba(212, 163, 115, 0.05);
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 60px;
            align-items: center;
        }

        /* 左側：品牌識別與標題區 */
        .brand-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 1px solid var(--ruili-border);
            padding-right: 40px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .logo-box {
            width: 85px;
            height: 85px;
            border-radius: 20px;
            background: #ffffff;
            border: 1px solid var(--ruili-border);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 6px 16px rgba(41, 37, 36, 0.05);
            transition: all 0.3s ease;
        }

        .logo-box:hover {
            border-color: var(--ruili-brand);
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(212, 163, 115, 0.15);
        }

        .logo-box img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
        }

        .profile-info h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--ruili-sidebar);
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .profile-info .sub-title {
            display: inline-block;
            font-size: 0.85rem;
            color: var(--ruili-dark);
            background-color: var(--ruili-pink);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            letter-spacing: 1.5px;
            margin-top: 14px;
        }

        /* 右側：功能按鈕網格區 (2x2 矩陣) */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .menu-btn {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #ffffff;
            border: 1px solid var(--ruili-border);
            border-radius: 20px;
            padding: 24px;
            color: var(--ruili-sidebar);
            text-decoration: none;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(41, 37, 36, 0.02);
            min-height: 140px;
            position: relative;
            overflow: hidden;
        }

        .menu-btn:hover {
            background: var(--ruili-sidebar);
            color: #ffffff;
            border-color: var(--ruili-sidebar);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(44, 42, 41, 0.18);
        }

        .menu-btn-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }

        .icon-badge {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: var(--ruili-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            transition: all 0.3s ease;
            border: 1px solid var(--ruili-border);
        }

        .menu-btn:hover .icon-badge {
            background: rgba(212, 163, 115, 0.25);
            border-color: rgba(212, 163, 115, 0.3);
        }

        .menu-btn .arrow {
            color: var(--ruili-brand);
            font-size: 1rem;
            transition: all 0.3s ease;
            opacity: 0.7;
        }

        .menu-btn:hover .arrow {
            color: var(--ruili-brand);
            transform: translateX(5px);
            opacity: 1;
        }

        .menu-btn span.btn-text {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-top: 15px;
        }

        /* 底部版權宣告與微型 LOGO 格 */
        .footer-note {
            margin-top: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.8rem;
            color: var(--ruili-dark);
            opacity: 0.8;
            letter-spacing: 1px;
        }

        .footer-logo {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            background: #ffffff;
            border: 1px solid var(--ruili-border);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 2px 4px rgba(41, 37, 36, 0.05);
        }

        .footer-logo img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
        }

        /* RWD 響應式調整：手機螢幕自動轉為直式優化版 */
        @media (max-width: 900px) {
            body {
                padding: 20px;
            }
            .main-container {
                grid-template-columns: 1fr;
                gap: 30px;
                padding: 30px 20px;
            }
            .brand-section {
                border-right: none;
                border-bottom: 1px solid var(--ruili-border);
                padding-right: 0;
                padding-bottom: 30px;
                text-align: center;
            }
            .logo-section {
                justify-content: center;
            }
            .menu-grid {
                grid-template-columns: 1fr;
            }
            .menu-btn {
                min-height: auto;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="top-accent-bar"></div>

    <div class="main-container">
        <!-- 左側：雙 LOGO 與品牌標題區 -->
        <div class="brand-section">
            <div class="logo-section">
                <div class="logo-box">
                    <img src="./logo1.png" alt="玖業光電 Logo">
                </div>
                <div class="logo-box">
                    <img src="./logo2.png" alt="威欣系統 Logo">
                </div>
            </div>

            <div class="profile-info">
                <h1>玖業光電科技有限公司</h1>
                <h1>威欣系統股份有限公司</h1>
                <div class="sub-title">專屬客戶服務與報價入口</div>
            </div>
        </div>

        <!-- 右側：四個功能按鈕 2x2 矩陣 -->
        <div class="menu-grid">
            <a href="#workflow" class="menu-btn" onclick="openModule('workflow')">
                <div class="menu-btn-top">
                    <div class="icon-badge">📊</div>
                    <span class="arrow">➔</span>
                </div>
                <span class="btn-text">專案執行流程</span>
            </a>

            <a href="#quotation" class="menu-btn" onclick="openModule('quotation')">
                <div class="menu-btn-top">
                    <div class="icon-badge">💰</div>
                    <span class="arrow">➔</span>
                </div>
                <span class="btn-text">睿立報價單</span>
            </a>

            <a href="#documents" class="menu-btn" onclick="openModule('documents')">
                <div class="menu-btn-top">
                    <div class="icon-badge">📁</div>
                    <span class="arrow">➔</span>
                </div>
                <span class="btn-text">總結說明</span>
            </a>

            <a href="#contact" class="menu-btn" onclick="openModule('contact')">
                <div class="menu-btn-top">
                    <div class="icon-badge">💬</div>
                    <span class="arrow">➔</span>
                </div>
                <span class="btn-text">專屬顧問諮詢</span>
            </a>
        </div>
    </div>

    <!-- 底部帶有微型 LOGO 的版權宣告 -->
    <div class="footer-note">
        <div class="footer-logo">
            <img src="./ruili-logo.png" alt="Ruili Logo">
        </div>
        <span>RUILI GROUP CLIENT PORTAL © 2026</span>
    </div>

    <script>
        function openModule(moduleName) {
            console.log("切換至模組: " + moduleName);
        }
    </script>

</body>
</html>
